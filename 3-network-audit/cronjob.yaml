apiVersion: batch/v1
kind: CronJob
metadata:
  name: fabric-pipeline-network-audit
  namespace: cortex-system
  labels:
    app.kubernetes.io/name: fabric-pipeline-network-audit
    app.kubernetes.io/part-of: git-fabric
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fabric-pipeline-network-audit
            app.kubernetes.io/part-of: git-fabric
        spec:
          serviceAccountName: fabric-k8s
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: pipeline
              image: ghcr.io/git-fabric/pipelines:latest
              imagePullPolicy: Always
              env:
                - name: PIPELINE_NAME
                  value: "3-network-audit"
                - name: FABRIC_GATEWAY_URL
                  value: "http://fabric-gateway.cortex-system.svc.cluster.local:3000"
                - name: CF_ZONE_ID
                  value: "055fc6396e0456826c7e31684284f5be"
                - name: NODE_ENV
                  value: production
              envFrom:
                - secretRef:
                    name: fabric-gateway-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
