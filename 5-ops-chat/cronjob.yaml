apiVersion: batch/v1
kind: CronJob
metadata:
  name: fabric-pipeline-ops-chat
  namespace: cortex-system
  labels:
    app.kubernetes.io/name: fabric-pipeline-ops-chat
    app.kubernetes.io/part-of: git-fabric
spec:
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fabric-pipeline-ops-chat
            app.kubernetes.io/part-of: git-fabric
        spec:
          serviceAccountName: fabric-k8s
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: pipeline
              image: ghcr.io/git-fabric/pipelines:latest
              imagePullPolicy: Always
              env:
                - name: PIPELINE_NAME
                  value: "5-ops-chat"
                - name: FABRIC_GATEWAY_URL
                  value: "http://fabric-gateway.cortex-system.svc.cluster.local:3000"
                - name: NODE_ENV
                  value: production
              envFrom:
                - secretRef:
                    name: fabric-gateway-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 512Mi
